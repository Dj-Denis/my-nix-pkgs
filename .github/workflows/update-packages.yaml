name: "Auto-Update Packages"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  find-packages:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.set-pkgs.outputs.pkgs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Extract package list from flake
        id: set-pkgs
        run: |
          # Evaluates the flake and outputs a JSON array of all package attribute names
          PKGS_JSON=$(nix eval --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          echo "Discovered packages: $PKGS_JSON"
          echo "pkgs=$PKGS_JSON" >> $GITHUB_OUTPUT

  update-package:
    needs: find-packages
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        pkg: ${{ fromJson(needs.find-packages.outputs.pkgs) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run nix-update for ${{ matrix.pkg }}
        id: update
        run: |
          nix run nixpkgs#nix-update -- --flake "${{ matrix.pkg }}" --use-update-script

      - name: Report Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Update Failed: \`${{ matrix.pkg }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Failed to run \`nix-update\` for package \`${{ matrix.pkg }}\`. Check step logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore(deps): update ${{ matrix.pkg }} source"
          title: "chore(deps): update ${{ matrix.pkg }} package version"
          body: |
            Automated update for package `${{ matrix.pkg }}`.

            Triggered by `.github/workflows/update-packages.yml`.
          branch: "auto-update/${{ matrix.pkg }}"
          delete-branch: true
          labels: |
            dependencies
            automated-pr

      - name: Report Success to Job Summary
        if: success()
        run: |
          echo "### ✅ Update Succeeded: \`${{ matrix.pkg }}\`" >> $GITHUB_STEP_SUMMARY
